plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

// kapt 在生成 Java 桩时会遇到 Compose 编译器插件注入的 @Composable 注解，
// 默认无法解析成 NonExistentClass 而报错。开启 correctErrorTypes 让 kapt 容错处理。
kapt {
    correctErrorTypes = true
}

android {
    namespace 'com.example.xiaonao'
    compileSdk 34

    // 读取不入库的 keystore.properties（含签名密码），不存在时跳过签名
    def keyProps = new Properties()
    def keyFile = rootProject.file('keystore.properties')
    if (keyFile.exists()) {
        keyFile.withInputStream { keyProps.load(it) }
    }
    def hasSigning = keyProps.containsKey('STORE_FILE')

    defaultConfig {
        applicationId 'com.example.xiaonao'
        minSdk 21
        targetSdk 34
        versionCode 30
        versionName '1.24'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile rootProject.file(keyProps['STORE_FILE'])
                storePassword keyProps['STORE_PASSWORD']
                keyAlias keyProps['KEY_ALIAS']
                keyPassword keyProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            // v1.24 起临时关闭 R8：v1.23 开启后出现「打开闪退」，回退到 v1.22 验证过的
            // 稳定配置先行修复；待定位根因后再以更稳妥的 keep 规则重新开启。
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        // 与 Kotlin 1.9.22 配套的 Compose 编译器版本
        kotlinCompilerExtensionVersion '1.5.10'
    }

    testOptions {
        unitTests {
            // Robolectric 需要访问 Android 资源（Room 迁移测试在 JVM 上跑）
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.4'
    implementation 'androidx.activity:activity-compose:1.9.2'

    // Compose（界面）
    implementation platform('androidx.compose:compose-bom:2024.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Room（本地数据库）
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Compose 运行时注解（kapt 生成桩时需可见 @Composable）
    implementation 'androidx.compose.runtime:runtime:1.6.8'

    // 协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // 单元测试（JVM 上跑，CI 无需模拟器）
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'androidx.room:room-testing:2.6.1'
}
